name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -race -count=1 ./...

  openspec-validate:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec

      - name: Validate specs (strict)
        run: openspec validate --all --strict

  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: [test, openspec-validate]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (daemon)
        id: meta-daemon
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/veriproc
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push daemon image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.veriproc
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta-daemon.outputs.tags }}
          labels: ${{ steps.meta-daemon.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker meta (console)
        id: meta-console
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/veriproc-console
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push console image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.console
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta-console.outputs.tags }}
          labels: ${{ steps.meta-console.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [test, openspec-validate]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        env:
          LDFLAGS: >-
            -X github.com/gobobr/veriproc/internal/version.Version=${{ github.ref_name }}
            -X github.com/gobobr/veriproc/internal/version.Commit=${{ github.sha }}
            -X github.com/gobobr/veriproc/internal/version.BuildDate=${{ github.event.repository.updated_at }}
        run: |
          mkdir -p dist
          for GOOS_GOARCH in linux/amd64 linux/arm64; do
            GOOS=${GOOS_GOARCH%/*}; GOARCH=${GOOS_GOARCH#*/}
            for BIN in veriprocd veriproc veriproc-console; do
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH \
                go build -ldflags "$LDFLAGS" -o "dist/${BIN}-${GOOS}-${GOARCH}" ./cmd/${BIN}
            done
          done
          cd dist && sha256sum * > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate-release-notes: true
          files: dist/*
          body: |
            ## Docker images

            - `${{ secrets.DOCKERHUB_USERNAME }}/veriproc:${{ github.ref_name }}`
            - `${{ secrets.DOCKERHUB_USERNAME }}/veriproc-console:${{ github.ref_name }}`

            Also available as `latest` and `${{ github.ref_name }}`-equivalent `major.minor` tags.
