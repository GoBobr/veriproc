station_id: STATION-A
station_name: Scenario 2 ingest
schema_version: veriproc.station/v1
description: |
  Sandbox station A selects two rolling-archive inputs, writes a JSON output,
  publishes it back to the hot archive, and triggers STATION-B.
execution:
  mode: local
  command: ./scripts/run.sh
scripts:
  run: ./scripts/run.sh
inputs:
  - file_type: PRIMARY_A_______
    category: product
    filename_pattern: "<MISSION_ID>_<FILE_TYPE>_<START_TIME>_<END_TIME>_<GENERATION_TIME>_*"
    window_match: overlaps
    margins: [0, 0]
    mandatory: true
  - file_type: AUX_A___________
    category: product
    filename_pattern: "<MISSION_ID>_<FILE_TYPE>_<START_TIME>_<END_TIME>_<GENERATION_TIME>_*"
    window_match: overlaps
    margins: [0, 0]
    mandatory: true
outputs:
  - file_type: A_RESULT________
    name: result-a.json
    filename_pattern: "result-a.json"
    mandatory: true
    publish:
      rolling_archive: hot
publication:
  enabled: true
  archive_id: hot
  mode: copy
  outputs:
    - result-a.json
downstream:
  - station_id: STATION-B
metadata:
  owner: sandbox
  cadence: 15m
