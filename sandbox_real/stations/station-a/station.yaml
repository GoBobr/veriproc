station_id: STATION-A
station_name: Scenario 2 ingest
schema_version: veriproc.station/v1
description: |
  Sandbox station A selects two rolling-archive inputs, writes a JSON output,
  publishes it back to the hot archive, and triggers STATION-B.
execution:
  mode: local
  command: ./scripts/run.sh
scripts:
  run: ./scripts/run.sh
inputs:
  - file_type: CLI_1B_RAD______
    category: product
    window_match: overlaps
    margins: [0, 0]
    mandatory: true
  - file_type: CO2_1A_GEO______
    category: product
    window_match: overlaps
    margins: [0, 0]
    mandatory: true
outputs:
  - file_type: SCE_2__ICM______
    mandatory: true
    publish:
      rolling_archive: hot
publication:
  enabled: true
  archive_id: hot
  mode: copy
  outputs:
    - "CDM?_SCE_2__ICM______*.nc"
# downstream:
#   - station_id: STATION-B
metadata:
  owner: sandbox
  cadence: 15m
