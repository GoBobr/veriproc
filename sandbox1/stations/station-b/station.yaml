station_id: statB
station_name: Track L1 processor
schema_version: veriproc.station/v1
description: |
  Sandbox station B consumes STATION-A's published output from the rolling
  archive and writes a small CSV product.

execution:
  # Uses the instance default executor (executor.default: slurm-native).
  # Set mode explicitly to override, e.g. mode: local for a lighter workload.
  mode: slurm-docker
  executable: ./scripts/run.sh
  container:
    image: ubuntu:latest  # required for slurm-docker
    
# joborder block is omitted: defaults to format: yaml, name: joborder.yaml.
# The daemon still writes the standard job order document; the workload can
# read it via VERIPROC_JOBORDER_PATH.

inputs:
  - file_type: SCE_2__ICM______
    # Searches all folders listed under the "product" product_category in
    # instance.yaml (proc-ra first, then prods).
    category: product
    window_match: overlaps
    margins: [0, 0]
    mandatory: true

outputs:
  - file_type: SCE_2__BIG______
    mandatory: true
    publish:
      # Publish into proc-ra so downstream stations can find it via the
      # "product" category (which includes rolling:proc-ra).
      rolling_archive: proc-ra
      mode: copy

downstream:
  # join: the daemon creates a statC task whose window matches this run's
  # window (or finds one that already exists) and places it in the
  # "waiting_inputs" state.  The task is only moved to "accepted" — making
  # it eligible for the dispatcher — once EVERY upstream station that shares
  # the same join_id for statC has finalised its run successfully.
  #
  # In this sandbox the two contributing stations are statA and statB.
  # statA publishes SCE_2__ICM______ and statB publishes SCE_2__BIG______;
  # statC declares both as mandatory inputs.  The join guarantees statC never
  # starts until both files are available in the rolling archive.
  #
  # The join_id (here: "a-b-to-c") must be identical in every upstream
  # station that participates in the same join.  The daemon derives the
  # downstream task ID deterministically from:
  #
  #   sha256("join" | join_id | station_id | window_start | window_end)
  #
  # so concurrent finalisations from statA and statB map to the same task
  # row.  The second contributor to finalise finds the task already in
  # "waiting_inputs" and advances it to "accepted" via a conditional
  # compare-and-swap update; if it is already "accepted" (rare race), the
  # CAS is a no-op and the task proceeds normally.
  #
  # Provenance: each contributing run writes its own provenance link to the
  # shared downstream task, so the lineage graph correctly shows two parents.
  - station_id: statC
    mode: join
    join_id: a-b-to-c
