station_id: statC
station_name: FanOut station C
schema_version: veriproc.station/v1
description: |
  Sandbox1 station C receives the SCE_2__BIG______ product from station B and
  writes task-out.yaml that declares one statD task per slice of the parent
  window, all sharing a single split group. No granule files are produced;
  station D reads the original SCE_2__BIG______ directly and processes only
  its assigned sub-window. Station-E (statE) aggregates the results once all
  group members are complete.
execution:
  mode: slurm-native
  executable: ./scripts/run.sh
inputs:
  - file_type: SCE_2__BIG______
    category: product
    window_match: overlaps
    margins: [0, 0]
    mandatory: true

downstream:
  - station_id: statD
    mode: task_out
  - station_id: statE
    mode: fan_in
