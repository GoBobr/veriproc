# ─── VeriProc Station Definition ─────────────────────────────────────────────
# Schema: veriproc.station/v1
#
# A station describes one processing step: the inputs to consume, how to
# invoke the workload, which outputs to validate and publish, and which
# downstream stations to trigger on success.
#
# Station files are loaded at daemon startup from the instance
# storage.station_config_root directory. The loader scans one level deep:
#   <station_config_root>/<any-directory>/station.yaml
#
# This file (station-a) is the most feature-complete example in the sandbox.
# See the other station files for patterns specific to fan-out/fan-in and
# parallel worker use cases.

# Unique station identifier. Stable across restarts; used as the task ID
# prefix and embedded in working-root path segments.
# Slug format recommended (a–z, 0–9, hyphens/underscores, no spaces).
station_id: statA

# Human-readable display name. Must be unique across all active stations.
station_name: Scenario 2 ingest

# Schema identifier. Must always be "veriproc.station/v1".
schema_version: veriproc.station/v1

# Optional free-text description. Not interpreted by the daemon.
description: |
  Sandbox station A selects two rolling-archive inputs, writes a JSON output,
  publishes it back to proc-ra, and triggers STATION-B.

# Optional SHA-256 fingerprint of this file used as a load-time consistency
# check. If present and non-empty the loader verifies it matches the computed
# hash; mismatches abort startup.  Remove or leave blank to skip verification.
# content_hash: "sha256:<64-hex-chars>"

# ─── Execution ────────────────────────────────────────────────────────────────
execution:
  # Executor backend to use for every run of this station.
  # Options:
  #   local        – OS child process on the daemon host (no cluster required).
  #   slurm-native – SLURM job; script runs directly on compute node.
  #   slurm-docker – SLURM job wrapped in a Docker container; requires
  #                  container.image below.
  #   (empty)      – inherit the instance executor.default (recommended).
  mode: slurm-docker

  # Path to the workload executable. Relative paths are resolved to absolute
  # at load time using the station directory as the base. Required unless the
  # station is purely declarative (e.g. routing-only with no workload).
  executable: ./scripts/run.sh

  # Optional CLI arguments appended after the executable. Rarely needed;
  # prefer VERIPROC_* environment variables injected by the executor.
  # args:
  #   - --verbose
  #   - --config=cfg.toml

  # Per-station SLURM resource requests. These override the instance-level
  # executor.slurm.defaults for every run of this station.
  # Omit any field (or set to 0) to inherit the instance default.
  # resources:
  #   cpus_per_task: 4         # --cpus-per-task= passed to sbatch
  #   mem_gb: 8                # --mem=<N>G passed to sbatch
  #   walltime: "00:30:00"     # HH:MM:SS, Go duration, or ISO-8601 PT string

  # Station-level SLURM scheduling overrides (applied on top of instance
  # executor defaults). Ignored for local or stub executors.
  # slurm:
  #   partition: express        # override executor.slurm.partition
  #   account: special-project  # override executor.slurm.account
  #   qos: high                 # override executor.slurm.qos
  #   extra_args:               # raw extra sbatch flags (non-empty strings only)
  #     - "--constraint=avx512"
  #     - "--nodelist=node042"

  # Container runtime settings (slurm-docker executor only).
  # Ignored for local and slurm-native executors.
  # container:
  #   image: registry.example.org/myimage:1.2.3  # required for slurm-docker
  #   mounts:                                     # appended to docker.default_mounts
  #     - /local/data:/data:ro
  #   user: "1000:1000"                           # override image default user
  container:
    image: ubuntu:latest  # required for slurm-docker
  #   mounts:                                     # appended to docker.default_mounts
  #     - /local/data:/data:ro
  #   user: "1000:1000"                           # override image default user

# ─── Job order ────────────────────────────────────────────────────────────────
# The daemon writes a structured document (the "job order") into the run's
# working root before launching the workload. The workload receives the file
# path via the VERIPROC_JOBORDER_PATH environment variable.
joborder:
  # Serialisation format of the job order document.
  # Options: yaml | toml | json | none
  #   none – do not write a job order file; VERIPROC_JOBORDER_PATH is unset.
  # Default: yaml.
  format: yaml

  # Filename for the job order file, relative to the working root.
  # Defaults per format: yaml → joborder.yaml, toml → joborder.toml,
  # json → joborder.json.  Must be a plain filename (no directory separators).
  name: joborder.yaml

  # Per-station path style override for input/output paths written into the
  # job order document.  Overrides the instance-level
  # generators.job_order.paths setting for this station only.
  # Options: relative | absolute
  #   relative – paths written as "./..." relative to the working root
  #              (default when the instance setting is also omitted or "relative")
  #   absolute – paths written as full filesystem paths; useful for processors
  #              that cannot resolve relative paths from the working root
  #              (e.g. called from a different directory).
  # Uncomment to force absolute paths for this station regardless of the
  # instance default:
  # paths: absolute

  # Arbitrary YAML mapping merged into the top level of the generated job order.
  # Scalar values and nested mappings may use context references <key> or
  # <key.subkey>.  Available context names at run time:
  #   – All top-level keys from instance definitions (e.g. <facility.processing_center>)
  #   – Runtime values: <task_id>, <station_id>, <window_start>, <window_end>,
  #                     <retry_index>, <run_ref>, <split_group_id>
  #   – Reserved path: <instance_root> – absolute directory of the instance config file
  #   – Resolved input paths (see spec §5.4 for the full input context shape)

  # ── Preprocess script (optional) ─────────────────────────────────────────
  # When set, the daemon executes this script before rendering the job order.
  # The script must print KEY=VALUE lines to stdout; these are injected into
  # the renderer context under the <prep.*> namespace.
  #
  # preprocess_script: path/to/script      # absolute, relative to CWD, or
  #                                        # with context refs e.g. <instance_root>/scripts/prep.sh
  # preprocess_args:
  #   - --mode minmax_scanline             # literal args …
  #   - "{input:CLI_1B_RAD______}"        # … or {input:FILE_TYPE} tokens
  #                                        #   → expanded to space-joined input paths
  #
  # Variables from the script are then available in joborder.include as:
  #   start_scanline: <prep.MIN_SCANLINE>
  #   end_scanline:   <prep.MAX_SCANLINE>
  # Or in a Go template renderer as:
  #   start_scanline: {{ index .PrepVars "MIN_SCANLINE" }}
  #
  # <instance_root> resolves to the directory that contains instance.yaml.
  # Placing scripts there keeps paths stable across deployments:
  #
  # preprocess_script: <instance_root>/scripts/extract_meta.py
  # preprocess_args:
  #   - "{input:CLI_1B_RAD______}"
  # include:
  #   start_scanline: <prep.MIN_SCANLINE>
  #   end_scanline:   <prep.MAX_SCANLINE>
  #
  # ─────────────────────────────────────────────────────────────────────────
  include:
    dyn_params:
      mode: NOMINAL
      CpuCores: 12
      test: True
      add: "fake"
    temporary_folder: ./temp
    config_files:
      - schemas
    facility:
      processing_center: <facility.processing_center>
      environment: <facility.environment>
      acquisition_station: <facility.acquisition_station>

# ─── Inputs ───────────────────────────────────────────────────────────────────
# Ordered list of input definitions. For each run the classical matcher
# searches the declared category folders for a file whose name satisfies the
# filename_pattern and whose time window satisfies the window_match constraint.
# Runs are blocked (not submitted) until all mandatory inputs are resolved.
inputs:
  - # Logical product type; drives <FILE_TYPE> substitution in filename_pattern.
    file_type: CLI_1B_RAD______

    # Product category to search. Must match a name in instance product_categories.
    category: product

    # Object kind expected on disk.
    # Options: regular_file (default) | directory
    # object_kind: regular_file

    # Override the instance filename_pattern for this input only. Uses the same
    # <COMPONENT> placeholder syntax. Omit to use the instance-level pattern.
    # filename_pattern: "<MISSION_ID>_<FILE_TYPE>_??_<START_TIME>_<END_TIME>_*"

    # Temporal relationship between the candidate file's window and the task's
    # processing window.
    # Options:
    #   overlaps      – half-open interval overlap: the candidate window and the
    #                   task window share at least one instant (default when the
    #                   filename_pattern contains time-stamp components).
    #   within_window – the candidate window is fully contained in the task window.
    # Aliases: "cross" → overlaps; "fully_within" → within_window.
    window_match: overlaps

    # Extend the effective task window by [before_seconds, after_seconds] when
    # searching for matching files. [0, 0] means no extension (default).
    margins: [0, 0]

    # When true the run is blocked (not submitted) if no matching file is found.
    # When false (default) the run proceeds without this input.
    mandatory: true

    # optional: true  # mutually exclusive with mandatory; input is skipped if absent

  - file_type: CO2_1A_GEO______
    category: product
    window_match: overlaps
    margins: [0, 0]
    mandatory: true

  - file_type: SCE_2__CAMF___AX
    category: aux
    # This auxiliary product is a directory artifact (e.g. a calibration file set).
    # The matcher locates the directory by name using the filename_pattern, then
    # verifies it is a directory before accepting it.
    object_kind: directory
    window_match: overlaps
    margins: [7200, 7200]
    mandatory: true

# ─── Outputs ──────────────────────────────────────────────────────────────────
# Ordered list of output definitions. After the workload exits successfully the
# daemon resolves each output in the run's working-root output/ directory, then
# validates and optionally publishes them.
outputs:
  - # Logical product type for this output. Drives <FILE_TYPE> substitution in
    # the filename_pattern when locating the produced file in output/.
    file_type: SCE_2__ICM______

    # Explicit literal filename to capture from output/. Use when the output
    # does not follow the instance filename_pattern (e.g. a fixed report name).
    # name: my_result.json

    # Object kind of the expected output artifact.
    # Options: regular_file (default) | directory
    # object_kind: regular_file

    # Glob pattern used to locate the output file instead of filename_pattern.
    # Matched against filenames inside output/. Takes precedence over
    # filename_pattern when both are set.
    # pattern: "result_*.nc"

    # When true a missing output causes the run to transition to the failed
    # state at finalisation time.
    mandatory: true

    # When true capture ALL files matching the pattern as individual artifacts
    # instead of only the newest single match. Useful for fan-out stations that
    # write a variable number of output files per run.
    # multiple: false

    # Custom directory where the workload writes this output. Supports context
    # references resolved against the standard station run context. When omitted,
    # defaults to <working_root>/output/ (the standard output directory).
    # The resolved path is written into the job order under outputs[].directory
    # and is also the directory the daemon scans during output validation, so the
    # workload must create and populate it.
    #
    # Examples:
    #   directory: <working_root>/output2/          # second output type in its own sub-dir
    #   directory: <working_root>/output/<task_id>  # per-task sub-directory
    # directory: <working_root>/output2/

    # Publication into a rolling archive after run finalisation.
    # Omit the publish block entirely to skip publication for this output.
    publish:
      # Archive ID key from instance rolling_archives. Required.
      rolling_archive: proc-ra

      # How the artifact is placed in the archive.
      # Options: copy – atomic copy preserving file content (default and only
      #                 currently supported mode).
      mode: copy

      # Optional relative sub-path within the archive root. When set the
      # artifact is written to <archive.path>/<target_subpath>/<filename>.
      # Must be relative and must not escape the archive root (no "..").
      # target_subpath: "YYYY/MM"

# ─── Downstream stations ──────────────────────────────────────────────────────
# Stations triggered after this station's run reaches the canonical (success)
# state. The daemon creates tasks at the listed downstream stations using the
# same processing window as the completing run.
downstream:
  - # Target station identifier. Must match a station_id loaded at startup.
    station_id: statB

    # Triggering mode. Controls when the downstream task is created.
    # Options:
    #   (empty) / normal – create the downstream task immediately when this run
    #                      is finalised (default).
    #   task_out         – do NOT trigger automatically; the workload instead
    #                      writes a task-out.yaml describing the child tasks to
    #                      create.  Used for dynamic fan-out splitting patterns.
    #   fan_in           – trigger only when the entire split group spawned by
    #                      this station reaches the "complete" state (all members
    #                      canonical). Used as the aggregation gate after a
    #                      task_out fan-out.
    # mode: normal

  # statA also participates in a join toward statC.  Together with statB,
  # which declares the same join_id, the two stations form a two-parent
  # barrier: statC is held in "waiting_inputs" until both statA and statB
  # have finalised successfully for the same processing window.
  # See station-b/station.yaml for the full join pattern description.
  - station_id: statC
    mode: join
    join_id: a-b-to-c
